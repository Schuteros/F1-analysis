[project]
name = "f1-analysis"
version = "0.1.0"
description = "Car vs driver section analysis from public F1 telemetry"
requires-python = ">=3.12"
dependencies = [
    "fastf1==3.8.3",
    "pandas==2.3.3",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pandas-stubs==2.3.3.260113",
    "scipy-stubs==1.18.1.1",
]

[project.scripts]
f1-analysis = "f1_analysis.cli:main"

[tool.setuptools]
packages = ["f1_analysis"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["f1_analysis", "tests"]

[[tool.mypy.overrides]]
module = ["fastf1.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/legacy_main.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "ANN401"]  # dev scripts handle untyped FastF1/JSON data
